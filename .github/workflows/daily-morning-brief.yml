name: daily-morning-brief

# Executive Morning Brief (Task 5) — NOT SCHEDULED. This workflow is
# workflow_dispatch-only, for manual/debug runs while the report is being
# proven out. No pg_cron / Supabase Cron entry exists for this route yet —
# see docs/morning-brief-activation-plan.md for what a human must do, in
# order, before this can replace any of the existing morning pushes.
#
# Delivery stays inert while MORNING_BRIEF_LINE_TARGETS is unset, the same
# double-gate every other report in this codebase uses before Production
# activation.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional business date override (YYYY-MM-DD). Leave blank for the previous business date."
        required: false
        type: string
      target:
        description: "Optional single LINE target override for UAT/manual runs."
        required: false
        type: string
      debug:
        description: "Preview the messages without sending any LINE push."
        required: false
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-morning-brief cron
        run: |
          URL="https://bot-summary.vercel.app/api/cron/daily-morning-brief"
          QUERY=""
          if [ -n "${{ inputs.date }}" ]; then
            QUERY="?date=${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.target }}" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&target=${{ inputs.target }}"; else QUERY="?target=${{ inputs.target }}"; fi
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&debug=1"; else QUERY="?debug=1"; fi
          fi
          curl -sf --max-time 60 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL$QUERY"
