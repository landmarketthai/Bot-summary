name: daily-morning-brief

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional business date override (YYYY-MM-DD). Leave blank for the previous business date."
        required: false
        type: string
      target:
        description: "Optional single LINE target override for UAT/manual runs."
        required: false
        type: string
      target_marker:
        description: "Optional exact LINE group marker text. Resolves the newest matching inbound group message."
        required: false
        type: string
      retry_nonce:
        description: "Optional unique token for a manual same-date resend. Requires target or target_marker."
        required: false
        type: string
      debug:
        description: "Preview the messages without sending any LINE push."
        required: false
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-morning-brief cron
        run: |
          URL="https://bot-summary.vercel.app/api/cron/daily-morning-brief"
          QUERY=""
          if [ -n "${{ inputs.date }}" ]; then
            QUERY="?date=${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.target }}" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&target=${{ inputs.target }}"; else QUERY="?target=${{ inputs.target }}"; fi
          fi
          if [ -n "${{ inputs.target_marker }}" ]; then
            MARKER_ENCODED="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "${{ inputs.target_marker }}")"
            if [ -n "$QUERY" ]; then QUERY="$QUERY&target_marker=$MARKER_ENCODED"; else QUERY="?target_marker=$MARKER_ENCODED"; fi
          fi
          if [ -n "${{ inputs.retry_nonce }}" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&retry_nonce=${{ inputs.retry_nonce }}"; else QUERY="?retry_nonce=${{ inputs.retry_nonce }}"; fi
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&debug=1"; else QUERY="?debug=1"; fi
          fi
          curl -sf --max-time 60 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL$QUERY"
