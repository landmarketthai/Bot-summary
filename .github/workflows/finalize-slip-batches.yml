name: finalize-slip-batches

# Supabase pg_cron job #1 is the sole scheduled slip finalizer (observed */2 * * * *).
# This workflow remains manual-only for incident recovery; do not schedule a duplicate.
# The application timing policy intentionally models a conservative 300-second period.
on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Call finalize-slip-batches cron
        run: |
          curl -sf --max-time 70 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://bot-summary.vercel.app/api/cron/finalize-slip-batches