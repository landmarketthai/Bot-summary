name: morning-brief-v3-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Synthetic local fixtures only; no repository/environment secrets or real sends.
    env:
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
      REQUIRE_MORNING_BRIEF_POSTGRES: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
      CRON_SECRET: synthetic-build-only
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
      SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install exact locked dependencies
        run: npm ci
      - name: Require local PostgreSQL 17
        run: |
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"
          version="$(psql -d postgres -tAc 'SHOW server_version_num')"
          test "$version" -ge 170000
          test "$version" -lt 180000
      - name: Verify skipped-test rejection
        run: node scripts/test-morning-brief-v3.mjs --self-test
      - name: Summary, PDF and migration regressions
        run: node scripts/test-morning-brief-v3.mjs summary
      - name: Route contract (separate process)
        run: node scripts/test-morning-brief-v3.mjs route
      - name: LINE mocked fetch (separate process)
        run: node scripts/test-morning-brief-v3.mjs line
      - name: Actual PostgreSQL suite (mocked HTTP queue, separate process)
        run: node scripts/test-morning-brief-v3.mjs pg
      - name: Typecheck
        run: npm run type-check
      - name: Lint remediation scope
        run: >-
          npx --no-install eslint src/app/api/cron/daily-morning-brief/route.ts
          src/app/api/cron/daily-morning-brief/route.test.ts src/lib/summary/morning-brief*.ts
          src/lib/summary/morning-brief*.tsx src/lib/pdf/MorningBriefA4Doc.tsx
          src/lib/line/reply.test.ts docs/handoffs/split-morning-brief-20261021/fixtures.ts
          scripts/render-morning-brief-v3.tsx scripts/test-morning-brief-v3.mjs
      - name: Synthetic production build
        run: npm run build
