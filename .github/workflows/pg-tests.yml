      - name: P3 real-PostgreSQL profitability snapshot suite
        run: bun run test:pg:p3
      - name: P2D migration 0054 regression suite (P3 reads its cost lines)
        run: bunx bun test src/lib/inventory-cost/migration-0054.pg.test.ts
      - name: P2E accountability-round regression suite (P3's only identity)
        run: bun run test:pg:p2e
      - name: Typecheck
        run: npm run type-check
      - name: git diff --check against the PR base
