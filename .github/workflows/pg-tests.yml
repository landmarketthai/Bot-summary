          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
      # P3 turns proven cost into money. It is verified against real PostgreSQL
      # or not at all — an unreachable database is a HARD FAILURE of this job,
      # never a green skip. The P2D/P2E regression suites below carry their own
      # required-flags for the same reason.
      REQUIRE_P3_POSTGRES: "1"
      REQUIRE_POSTGRES_TESTS: "1"
      REQUIRE_P2E_POSTGRES: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
    steps:
