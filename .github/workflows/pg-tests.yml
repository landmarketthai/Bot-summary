      # Round-keyed reconciliation and the missing-return classification. These
      # reproduce the 2026-08-10 Production failures without a database.
      - name: Round market identity and missing-return regression suites
        run: bunx bun test src/lib/produce/round-return-status.test.ts src/lib/summary/round-market-identity.test.ts src/lib/sales/round-return-sold-out.test.ts
      - name: Produce out-of-order admission real-PostgreSQL suite
