      - name: Migration 0052 PostgreSQL regression suite
        run: bunx bun test src/lib/purchase-receipts/migration-0052.pg.test.ts
      - name: Migration 0053 PostgreSQL regression suite
        run: bunx bun test src/lib/inventory-ledger/migration-0053.pg.test.ts
