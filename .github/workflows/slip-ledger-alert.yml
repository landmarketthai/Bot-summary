name: slip-ledger-alert

# Alert route is inert until SLIP_LEDGER_ALERT_ENABLED and a recipient are configured.
# Keep manual-only while disabled; restore a schedule when the alert is activated.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The route itself is fail-closed: until the explicit Vercel feature flag
      # and recipient are configured this call cannot send a LINE message.
      - name: Check durable slip ledger alert
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --max-time 35 \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://bot-summary.vercel.app/api/cron/slip-ledger-alert
