name: slip-ledger-alert

# Scheduled calls are additionally gated by the exact repository variable value
# SLIP_LEDGER_ALERT_SCHEDULE_ENABLED=true. The route remains fail-closed until
# its Vercel flag, recipient, token, and scheduler secret are configured.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  alert:
    if: github.event_name != 'schedule' || vars.SLIP_LEDGER_ALERT_SCHEDULE_ENABLED == 'true'
    concurrency:
      group: slip-ledger-alert
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The route itself is fail-closed: until the explicit Vercel feature flag
      # and recipient are configured this call cannot send a LINE message.
      - name: Check durable slip ledger alert
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --max-time 35 \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://bot-summary.vercel.app/api/cron/slip-ledger-alert
